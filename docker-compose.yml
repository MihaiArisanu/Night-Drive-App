services:
  db:
    image: postgis/postgis:15-3.4
    platform: linux/amd64
    container_name: nightdrive-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - nightdrive-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nightdrive-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  zen-engine:
    build: ./zen-engine
    container_name: nightdrive-zen
    environment:
      - DATABASE_URL=postgresql://zen_ro:${ZEN_RO_PASSWORD}@db:5432/${DB_NAME}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    depends_on:
      - db
    restart: unless-stopped

  nightdrive-api:
    build: ./api
    container_name: nightdrive-backend
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis:6379
      ZEN_ENGINE_URL: http://zen-engine:8000
    ports:
      - "8080:8080"
    volumes:
      - ./api/uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - zen-engine 
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nightdrive-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nightdrive-minio-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: nightdrive-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nightdrive-api
    restart: unless-stopped

volumes:
  nightdrive-db-data:
  nightdrive-minio-data:
  caddy_data:
  caddy_config:
