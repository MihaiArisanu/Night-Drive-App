services:
  db:
    image: postgis/postgis:15-3.4
    container_name: nightdrive-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - nightdrive-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  nightdrive-backend:
    build: ./backend
    container_name: nightdrive-backend
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped

  nightdrive-frontend:
    build: ./frontend
    container_name: nightdrive-frontend
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          memory: 256M

volumes:
  nightdrive-db-data: