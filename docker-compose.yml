services:
  db:
    image: postgis/postgis:15-3.4
    container_name: nightdrive-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - nightdrive-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nightdrive-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  nightdrive-api:
    build: ./api
    container_name: nightdrive-backend
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis:6379
    ports:
      - "8080:8080"
    volumes:
      - ./api/uploads:/app/uploads
    env_file:
      - ./api/.env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nightdrive-client:
    build: ./client
    container_name: nightdrive-frontend
    ports:
      - "8081:8081"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - ./client/.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          memory: 256M

volumes:
  nightdrive-db-data: