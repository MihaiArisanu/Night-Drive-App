services:
  db:
    image: postgis/postgis:15-3.4
    platform: linux/amd64
    container_name: nightdrive-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - nightdrive-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nightdrive-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  zen-engine:
    build: ./zen-engine
    container_name: nightdrive-zen
    environment:
      - DATABASE_URL=postgresql://zen_ro:${ZEN_RO_PASSWORD}@db:5432/${DB_NAME}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    depends_on:
      - db
    restart: unless-stopped

  nightdrive-api:
    build: ./api
    container_name: nightdrive-backend
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis:6379
      ZEN_ENGINE_URL: http://zen-engine:8000
    ports:
      - "8080:8080"
    volumes:
      - ./api/uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - zen-engine 
    restart: unless-stopped

volumes:
  nightdrive-db-data: