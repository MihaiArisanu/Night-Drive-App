services:
  db:
    image: postgis/postgis:15-3.4
    platform: linux/amd64
    container_name: nightdrive-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - nightdrive-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nightdrive-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  zen-engine:
    build: ./zen-engine
    container_name: nightdrive-zen
    environment:
      - DATABASE_URL=postgresql://zen_ro:${ZEN_RO_PASSWORD}@db:5432/${DB_NAME}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - OVERPASS_URLS=${OVERPASS_URLS:-https://z.overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nightdrive-api:
    build: ./api
    container_name: nightdrive-backend
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis:6379
      ZEN_ENGINE_URL: http://zen-engine:8000
      OVERPASS_URLS: ${OVERPASS_URLS:-https://z.overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter}
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?Set LIVEKIT_PUBLIC_URL to the externally reachable LiveKit WebSocket URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-nightdrive-main}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      SPONTANEOUS_RADIUS_METERS: ${SPONTANEOUS_RADIUS_METERS:-1000}
      SPONTANEOUS_MAX_ROAD_DISTANCE_METERS: ${SPONTANEOUS_MAX_ROAD_DISTANCE_METERS:-3000}
      SPONTANEOUS_LOCATION_MAX_AGE_SECONDS: ${SPONTANEOUS_LOCATION_MAX_AGE_SECONDS:-12}
      SPONTANEOUS_MAX_ACCURACY_METERS: ${SPONTANEOUS_MAX_ACCURACY_METERS:-100}
      SPONTANEOUS_OFFER_TTL_SECONDS: ${SPONTANEOUS_OFFER_TTL_SECONDS:-10}
      SPONTANEOUS_PAIR_COOLDOWN_SECONDS: ${SPONTANEOUS_PAIR_COOLDOWN_SECONDS:-300}
      SPONTANEOUS_EVALUATION_LOCK_SECONDS: ${SPONTANEOUS_EVALUATION_LOCK_SECONDS:-30}
    ports:
      - "8080:8080"
    volumes:
      - ./api/uploads:/app/uploads
      - ./secrets:/run/secrets:ro
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - zen-engine
      - minio
      - livekit
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nightdrive-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nightdrive-minio-data:/data
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.1
    container_name: nightdrive-livekit
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:?Set LIVEKIT_NODE_IP to the Docker host LAN address}
      - --udp-port
      - "7882"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: nightdrive-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nightdrive-api
    restart: unless-stopped

volumes:
  nightdrive-db-data:
  nightdrive-minio-data:
  caddy_data:
  caddy_config:
